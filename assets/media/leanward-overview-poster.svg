<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Leanward nutrition tracker overview</title>
  <desc id="desc">A dark blue nutrition dashboard graphic with the words Track Nutrition, See Progress, Get Results.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset=".55" stop-color="#0b2440"/><stop offset="1" stop-color="#083344"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172033"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1130" cy="90" r="250" fill="#0ea5e9" opacity=".08"/><circle cx="85" cy="680" r="260" fill="#34d399" opacity=".07"/>
  <g transform="translate(76 96)">
    <text fill="#94a3b8" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700" letter-spacing="3">LEANWARD NUTRITION TRACKER</text>
    <text y="74" fill="#f8fafc" font-family="system-ui,Segoe UI,sans-serif" font-size="58" font-weight="800">Track Nutrition.</text>
    <text y="141" fill="#f8fafc" font-family="system-ui,Segoe UI,sans-serif" font-size="58" font-weight="800">See Progress.</text>
    <text y="208" fill="#38bdf8" font-family="system-ui,Segoe UI,sans-serif" font-size="58" font-weight="800">Get Results.</text>
  </g>
  <g transform="translate(665 102)">
    <rect width="535" height="438" rx="26" fill="url(#card)" stroke="#475569" stroke-width="2"/>
    <text x="34" y="48" fill="#f8fafc" font-family="system-ui,Segoe UI,sans-serif" font-size="21" font-weight="700">TODAY'S PROGRESS</text>
    <g transform="translate(34 76)">
      <rect width="220" height="94" rx="16" fill="#020617" stroke="#334155"/><text x="18" y="35" fill="#94a3b8" font-family="system-ui" font-size="16">Calories</text><text x="18" y="69" fill="#38bdf8" font-family="system-ui" font-size="28" font-weight="700">On track</text>
      <rect x="245" width="220" height="94" rx="16" fill="#020617" stroke="#334155"/><text x="263" y="35" fill="#94a3b8" font-family="system-ui" font-size="16">Protein</text><text x="263" y="69" fill="#34d399" font-family="system-ui" font-size="28" font-weight="700">Goal met</text>
    </g>
    <g transform="translate(34 205)"><text fill="#94a3b8" font-family="system-ui" font-size="16">DAILY CONSISTENCY</text><rect y="25" width="465" height="16" rx="8" fill="#253247"/><rect y="25" width="392" height="16" rx="8" fill="#34d399"/>
      <polyline points="0,170 72,151 145,158 220,112 292,101 364,61 465,42" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#f8fafc"><circle cx="0" cy="170" r="7"/><circle cx="72" cy="151" r="7"/><circle cx="145" cy="158" r="7"/><circle cx="220" cy="112" r="7"/><circle cx="292" cy="101" r="7"/><circle cx="364" cy="61" r="7"/><circle cx="465" cy="42" r="7"/></g>
    </g>
  </g>
  <g transform="translate(457 494)"><circle cx="88" cy="88" r="86" fill="#0c4a6e" stroke="#e2e8f0" stroke-width="4"/><path d="M72 52 72 124 128 88Z" fill="#fff"/></g>
  <text x="76" y="690" fill="#cbd5e1" font-family="system-ui,Segoe UI,sans-serif" font-size="24">Simple daily guidance for healthier, stronger habits.</text>
</svg>
